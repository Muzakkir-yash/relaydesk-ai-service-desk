# Render Blueprint — free public demo of RelayDesk.
# Render → New → Blueprint → pick this GitHub repo. Plan "free" (no paid resources).
#
# The free plan has no persistent disk: the SQLite database is wiped whenever
# the service restarts or sleeps (after 15 idle minutes). SEED_DEMO_DATA rebuilds
# a clean demo on every start, and DEMO_MODE protects the shared demo logins.
services:
  - type: web
    name: relaydesk-demo
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: >
      pip install -r backend/requirements.txt &&
      cd backend &&
      ENVIRONMENT=development python -c "from ai.intent_model import warm_up; warm_up()"
    # ^ pre-trains the chatbot models during the build (the free server has very little CPU)
    startCommand: >
      cd backend &&
      uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./relaydesk.db
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: ENABLE_PAID_AI
        value: "false"
