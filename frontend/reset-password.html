<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password — NexusIT Service Desk</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .reset-card { width: 100%; max-width: 420px; padding: 28px; }
  </style>
</head>
<body>
  <div class="card reset-card">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 18px;">
      <img src="/assets/logo.jpg" alt="" style="width: 36px; height: 36px; border-radius: 8px; object-fit: cover;" />
      <div>
        <div style="font-weight: 800; color: var(--text-main);">NexusIT</div>
        <div style="font-size: 11.5px; color: var(--text-muted);">Enterprise Service Desk</div>
      </div>
    </div>

    <div id="reset-view">
      <h1 style="font-size: 20px; font-weight: 800; color: var(--text-main);">Choose a new password</h1>
      <p style="font-size: 13px; color: var(--text-muted); margin: 4px 0 18px;">This link works once. After saving, you'll be signed out everywhere and can sign in with the new password.</p>
      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="new-pass">New password</label>
          <input type="password" id="new-pass" class="form-input" minlength="8" maxlength="128" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-pass">Confirm new password</label>
          <input type="password" id="confirm-pass" class="form-input" minlength="8" maxlength="128" required autocomplete="new-password" />
        </div>
        <div id="reset-error" style="display: none; color: #dc2626; font-size: 12.5px; margin-bottom: 12px;"></div>
        <button type="submit" id="reset-btn" class="btn btn-primary" style="width: 100%;">Save new password</button>
      </form>
    </div>

    <div id="done-view" style="display: none; text-align: center;">
      <div style="font-size: 36px;">✅</div>
      <h1 style="font-size: 19px; font-weight: 800; color: var(--text-main); margin-top: 6px;">Password updated</h1>
      <p style="font-size: 13px; color: var(--text-muted); margin: 6px 0 18px;">You can now sign in with your new password.</p>
      <a href="/login.html" class="btn btn-primary" style="width: 100%;">Go to sign in</a>
    </div>
  </div>

  <script type="module">
    import { apiRequest } from './js/api.js';

    const token = new URLSearchParams(window.location.search).get('token') || '';
    // Remove the token from the address bar and history once read
    history.replaceState(null, '', '/reset-password.html');

    const errorBox = document.getElementById('reset-error');
    const showError = (msg) => { errorBox.textContent = msg; errorBox.style.display = 'block'; };

    if (!token) {
      showError('This reset link is incomplete. Ask IT for a new one.');
      document.getElementById('reset-btn').disabled = true;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      const newPassword = document.getElementById('new-pass').value;
      if (newPassword !== document.getElementById('confirm-pass').value) {
        showError("The two passwords don't match.");
        return;
      }
      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await apiRequest('/auth/reset-password', { method: 'POST', body: { token, new_password: newPassword } });
        localStorage.removeItem('nexus_user');
        document.getElementById('reset-view').style.display = 'none';
        document.getElementById('done-view').style.display = 'block';
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Save new password';
      }
    });
  </script>
</body>
</html>
