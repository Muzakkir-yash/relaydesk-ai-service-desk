<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusIT — Enterprise Service Desk</title>
  <script type="module">
    import { getUser } from './js/auth.js';
    const user = getUser();
    if (!user) {
      window.location.replace('/login.html');
    } else {
      if (user.role === 'technician') window.location.replace('/queue.html');
      else if (user.role === 'admin') window.location.replace('/metrics.html');
      else window.location.replace('/tickets.html');
    }
  </script>
</head>
<body style="background: #f4f6fa; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
  <p id="status" style="color: #64748b; font-size: 14px;">Redirecting to NexusIT Service Desk...</p>
  <script>
    // ES modules don't load from file:// — the app must be served by the backend
    if (location.protocol === 'file:') {
      document.getElementById('status').innerHTML =
        'This page can\'t be opened as a file. Run <b>start.bat</b>, then open ' +
        '<a href="http://localhost:8000">http://localhost:8000</a>.';
    }
  </script>
</body>
</html>
