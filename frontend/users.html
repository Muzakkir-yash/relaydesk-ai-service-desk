<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory — NexusIT Service Desk</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="app-container">
    <div class="main-wrapper">
      <main class="content-body">
        <div class="container-narrow">
          
          <div class="card" style="padding: 24px; margin-bottom: 24px;">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
              <div>
                <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary);">Administration</div>
                <h1 style="font-size: 22px; font-weight: 800; color: var(--text-main); margin-top: 2px;">Enterprise Users & Access</h1>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Provision accounts, assign technician support tiers, and link primary workstation hardware.</p>
              </div>
              <button id="add-user-btn" class="btn btn-primary btn-sm">+ Add Enterprise User</button>
            </div>
          </div>

          <div class="card" style="padding: 0; overflow: hidden;">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Email Address</th>
                    <th>System Role</th>
                    <th>Support Level</th>
                    <th>Assigned Workstation</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="users-tbody">
                  <tr>
                    <td colspan="6" style="text-align: center; padding: 48px; color: var(--text-muted);">Loading user directory...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- Create User Modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal-card" style="max-width: 500px;">
      <div class="modal-header">
        <h3 style="font-size: 16px; font-weight: 800; color: var(--text-main);">Add Enterprise User</h3>
        <button class="btn btn-ghost btn-sm close-user-modal">✕</button>
      </div>
      <form id="user-form" class="modal-body">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="u-name" class="form-input" placeholder="e.g. John Doe" required />
        </div>
        <div class="form-group">
          <label class="form-label">Enterprise Work Email</label>
          <input type="email" id="u-email" class="form-input" placeholder="jdoe@company.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Initial Password</label>
          <input type="password" id="u-pass" minlength="8" class="form-input" value="password123" required />
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <select id="u-role" class="form-select">
            <option value="enduser">End User</option>
            <option value="technician" selected>Technician</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="form-group" id="tier-form-group">
          <label class="form-label">Support Level / Tier</label>
          <select id="u-tier" class="form-select">
            <option value="L1">L1 — Service Desk & Triage</option>
            <option value="L2" selected>L2 — Systems & Network Specialist</option>
            <option value="L3">L3 — Senior Infrastructure / Lead</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Assigned Workstation Hostname (Optional)</label>
          <input type="text" id="u-device" class="form-input" placeholder="e.g. LAPTOP-CORP-099" />
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm close-user-modal">Cancel</button>
        <button type="submit" form="user-form" class="btn btn-primary btn-sm">Create User</button>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal-overlay" id="edit-user-modal">
    <div class="modal-card" style="max-width: 500px;">
      <div class="modal-header">
        <h3 style="font-size: 16px; font-weight: 800; color: var(--text-main);">Edit User</h3>
        <button class="btn btn-ghost btn-sm close-edit-modal">✕</button>
      </div>
      <form id="edit-user-form" class="modal-body">
        <input type="hidden" id="e-id" />
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="text" id="e-email" class="form-input" disabled />
        </div>
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="e-name" class="form-input" required maxlength="128" />
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <select id="e-role" class="form-select">
            <option value="enduser">End User</option>
            <option value="technician">Technician</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="form-group" id="e-tier-group">
          <label class="form-label">Support Level / Tier</label>
          <select id="e-tier" class="form-select">
            <option value="L1">L1 — Service Desk & Triage</option>
            <option value="L2">L2 — Systems & Network Specialist</option>
            <option value="L3">L3 — Senior Infrastructure / Lead</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Team (used for auto-assignment, e.g. network, hardware, access)</label>
          <input type="text" id="e-team" class="form-input" maxlength="64" />
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm close-edit-modal">Cancel</button>
        <button type="submit" form="edit-user-form" class="btn btn-primary btn-sm">Save Changes</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { renderLayout, showToast } from './js/app.js';
    import { apiRequest } from './js/api.js';
    import { escapeHtml } from './js/utils.js';

    const user = requireAuth(['admin']);
    if (user) {
      renderLayout('User Directory', '/users.html');

      const roleSelect = document.getElementById('u-role');
      const tierGroup = document.getElementById('tier-form-group');

      roleSelect.addEventListener('change', () => {
        if (roleSelect.value === 'technician') {
          tierGroup.style.display = 'block';
        } else {
          tierGroup.style.display = 'none';
        }
      });

      let allUsers = [];

      async function loadUsers() {
        try {
          allUsers = await apiRequest('/users');
          renderUsers(allUsers);
        } catch (err) {
          showToast('Failed to load users: ' + err.message, 'error');
        }
      }

      function renderUsers(users) {
        const tbody = document.getElementById('users-tbody');
        tbody.innerHTML = users.map(u => {
          const initials = escapeHtml((u.name?.trim()?.[0] || u.email?.trim()?.[0] || 'U').toUpperCase());
          const isSelf = u.id === user.id;
          
          let roleBadge = '';
          if (u.role === 'admin') {
            roleBadge = '<span class="badge-text" style="background: #fef3c7; color: #92400e; border: 1px solid #fde68a;">🛡️ ADMIN</span>';
          } else if (u.role === 'technician') {
            roleBadge = '<span class="badge-text" style="background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe;">🔧 TECH</span>';
          } else {
            roleBadge = '<span class="badge-text" style="background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe;">👤 USER</span>';
          }

          const tier = u.support_level || 'L1';
          let tierBadge = '<span style="color: var(--text-subtle);">—</span>';
          if (u.role === 'technician' || u.role === 'admin') {
            if (tier === 'L3') {
              tierBadge = '<span class="badge-text" style="background: #fef3c7; color: #b45309; border: 1px solid #fde68a; font-weight: 800;">L3 • Senior</span>';
            } else if (tier === 'L2') {
              tierBadge = '<span class="badge-text" style="background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; font-weight: 700;">L2 • Specialist</span>';
            } else {
              tierBadge = '<span class="badge-text" style="background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; font-weight: 700;">L1 • Triage</span>';
            }
          }

          return `
            <tr>
              <td>
                <div style="display: flex; align-items: center; gap: 10px;">
                  <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #4f46e5, #8b5cf6); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;">
                    ${initials}
                  </div>
                  <div style="font-weight: 700; color: var(--text-main); font-size: 13.5px;">${escapeHtml(u.name || 'User')}</div>
                </div>
              </td>
              <td>
                <span style="color: var(--text-muted); font-size: 13px;">${escapeHtml(u.email)}</span>
              </td>
              <td>
                ${roleBadge}
              </td>
              <td>
                ${tierBadge}
              </td>
              <td>
                <span style="font-family: var(--font-mono); font-size: 12px; color: var(--text-main); background: #f1f5f9; padding: 2px 7px; border-radius: var(--radius-xs);">
                  ${u.primary_device ? (typeof u.primary_device === 'object' ? escapeHtml(u.primary_device.device_name || 'Configured') : escapeHtml(u.primary_device)) : '—'}
                </span>
              </td>
              <td style="text-align: right; white-space: nowrap;">
                <button class="btn btn-secondary btn-sm" data-edit="${u.id}">Edit</button>
                ${isSelf ? '' : `<button class="btn btn-ghost btn-sm" style="color: #dc2626;" data-delete="${u.id}">Delete</button>`}
              </td>
            </tr>
          `;
        }).join('');

        tbody.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openEdit(Number(btn.dataset.edit))));
        tbody.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => deleteUser(Number(btn.dataset.delete))));
      }

      const editRole = document.getElementById('e-role');
      const editTierGroup = document.getElementById('e-tier-group');
      editRole.addEventListener('change', () => {
        editTierGroup.style.display = editRole.value === 'enduser' ? 'none' : 'block';
      });

      function openEdit(id) {
        const u = allUsers.find(x => x.id === id);
        if (!u) return;
        document.getElementById('e-id').value = u.id;
        document.getElementById('e-email').value = u.email;
        document.getElementById('e-name').value = u.name || '';
        editRole.value = u.role;
        document.getElementById('e-tier').value = u.support_level || 'L1';
        document.getElementById('e-team').value = u.team || '';
        editTierGroup.style.display = u.role === 'enduser' ? 'none' : 'block';
        document.getElementById('edit-user-modal').classList.add('open');
      }

      document.querySelectorAll('.close-edit-modal').forEach(b => {
        b.addEventListener('click', () => document.getElementById('edit-user-modal').classList.remove('open'));
      });

      document.getElementById('edit-user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('e-id').value;
        const role = editRole.value;
        const body = {
          name: document.getElementById('e-name').value.trim(),
          role,
          team: document.getElementById('e-team').value.trim(),
          support_level: role === 'enduser' ? 'L1' : document.getElementById('e-tier').value,
        };
        try {
          await apiRequest(`/users/${id}`, { method: 'PATCH', body });
          showToast('User updated.', 'success');
          document.getElementById('edit-user-modal').classList.remove('open');
          loadUsers();
        } catch (err) {
          showToast('Update failed: ' + err.message, 'error');
        }
      });

      async function deleteUser(id) {
        const u = allUsers.find(x => x.id === id);
        if (!u || !confirm(`Delete ${u.name} (${u.email})? This cannot be undone.`)) return;
        try {
          await apiRequest(`/users/${id}`, { method: 'DELETE' });
          showToast('User deleted.', 'success');
          loadUsers();
        } catch (err) {
          // e.g. 409 when the user has ticket history and must be kept
          showToast('Cannot delete: ' + err.message, 'error');
        }
      }


      document.getElementById('add-user-btn').addEventListener('click', () => {
        document.getElementById('user-modal').classList.add('open');
      });

      document.querySelectorAll('.close-user-modal').forEach(b => {
        b.addEventListener('click', () => document.getElementById('user-modal').classList.remove('open'));
      });

      document.getElementById('user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('u-name').value;
        const email = document.getElementById('u-email').value;
        const password = document.getElementById('u-pass').value;
        const role = document.getElementById('u-role').value;
        const support_level = (role === 'admin') ? 'L3' : (role === 'technician' ? document.getElementById('u-tier').value : 'L1');
        const primary_device = document.getElementById('u-device').value;

        try {
          await apiRequest('/users', {
            method: 'POST',
            body: { name, email, password, role, support_level, primary_device }
          });
          showToast('User created successfully!', 'success');
          document.getElementById('user-modal').classList.remove('open');
          document.getElementById('user-form').reset();
          loadUsers();
        } catch (err) {
          showToast('Failed to create user: ' + err.message, 'error');
        }
      });

      loadUsers();
    }
  </script>
</body>
</html>
